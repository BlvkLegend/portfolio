    <style>
        :root {
            --bg: #020409;
            --s1: #080d18;
            --s2: #0c1424;
            --border: #0e1f3a;
            --border2: #162d52;
            --text: #e8f4ff;
            --muted: #5a7a9e;
            --dim: #2a4060;
            --blue: #00b4ff;
            --blue2: #38d1ff;
            --blue3: #0077cc;
            --glow: rgba(0,180,255,0.14);
            --glow2: rgba(0,180,255,0.06);
            --green: #00e5a0;
            --r: 14px;
            --ease: cubic-bezier(0.16,1,0.3,1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 400;
            line-height: 1.6;
            overflow-x: hidden;
            cursor: none;
        }

        /* SCANLINE OVERLAY */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,180,255,0.012) 2px, rgba(0,180,255,0.012) 4px);
            pointer-events: none;
            z-index: 9997;
        }

        /* CUSTOM CURSOR */
        #cur {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--blue2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width .15s, height .15s;
        }

        #cur-ring {
            position: fixed;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(0,180,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width .25s var(--ease), height .25s var(--ease), border-color .25s;
        }

        body:has(a:hover) #cur-ring,
        body:has(button:hover) #cur-ring {
            width: 50px;
            height: 50px;
            border-color: var(--blue);
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 18px 5vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background .4s, border-color .4s;
            border-bottom: 1px solid transparent;
        }

        nav.scrolled {
            background: rgba(2,4,9,0.9);
            backdrop-filter: blur(24px);
            border-color: var(--border);
        }

        .nav-logo {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            color: var(--blue);
            text-decoration: none;
            letter-spacing: .02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-logo .blink {
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            font-size: .8rem;
            font-weight: 500;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition: color .2s;
            font-family: 'Space Mono', monospace;
        }

        .nav-links a:hover {
            color: var(--blue);
        }

        .nav-cta {
            padding: 9px 20px;
            border-radius: 4px;
            border: 1px solid var(--blue);
            color: var(--blue);
            font-size: .78rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: .06em;
            text-transform: uppercase;
            font-family: 'Space Mono', monospace;
            transition: all .2s;
            box-shadow: 0 0 16px rgba(0,180,255,0.2);
        }

        .nav-cta:hover {
            background: var(--blue);
            color: #000;
            box-shadow: 0 0 32px rgba(0,180,255,0.5);
        }

        /* Hamburger & Mobile Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 1.5px;
            background: var(--text);
            transition: .3s;
        }

        .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

        .mobile-menu {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99;
            background: rgba(2,4,9,0.98);
            backdrop-filter: blur(24px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
        }

        .mobile-menu.open { display: flex; }

        .mobile-menu a {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--text);
            text-decoration: none;
            transition: color .2s;
        }

        .mobile-menu a:hover { color: var(--blue); }

        /* General */
        section { position: relative; z-index: 2; }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 5vw;

            .hamburger { display: flex; }
        }
